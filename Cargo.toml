[package]
edition      = "2024"
name         = "phoenix-eternal-mm"
publish      = false
rust-version = "1.89.0"
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
test       = true

[dependencies]
phoenix-rise    = { version = "0.6.12", default-features = false, features = ["cpi"] }
pinocchio       = "0.9.3"
pinocchio-pubkey = "0.3.0"
sha2-const-stable = "0.1"
wincode         = { version = "0.6.2", default-features = false, features = ["derive"] }

[dev-dependencies]
phoenix-rise              = { version = "0.6.12", default-features = false, features = ["core"] }
phoenix-rise-litesvm-test = "0.6.12"
solana-commitment-config = "3.1"
solana-compute-budget-interface = "3.0"
solana-instruction = { version = "3.4", default-features = false, features = ["std"] }
serde_json         = "1.0"
solana-keypair     = "3.1"
solana-pubkey      = { version = "4.2", features = ["curve25519"] }
solana-rpc-client  = "4.2.2"
solana-rpc-client-api = "4.2.2"
solana-signer      = "3.0"
solana-transaction = "4.1"
ureq               = "3"
wincode            = { version = "0.6.2", features = ["derive"] }

[lints.rust.unexpected_cfgs]
check-cfg = ['cfg(target_os, values("solana"))']
level     = "allow"
